name: Framework verification

on:
  push:
    branches:
      - main
      - '[0-9][0-9]-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 17 verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Java and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run device-independent suite
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: framework-verification-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            reports/
            logs/
            target/cucumber-reports/
            target/surefire-reports/
